name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies (CPU PyTorch; no GPU or weights needed)
        run: |
          python -m pip install --upgrade pip
          # The CPU wheels of the pinned versions, so the vision requirements below are already met.
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-vision.txt -r requirements-api.txt ruff==0.17.1 mypy==2.4.0
      - name: Ruff
        run: ruff check .
      - name: Mypy (api/)
        run: mypy
      - name: Pytest
        run: python -m pytest -q

  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
