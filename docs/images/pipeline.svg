<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#152033"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8fa3bf"/>
    </marker>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <text x="40" y="44" fill="#ffffff" font-size="22" font-weight="700">ProPass · two cameras, one physical ledger</text>
  <text x="40" y="68" fill="#8fa3bf" font-size="14">Pixels in, explainable cart out. Unity's ground truth never reaches the checkout API.</text>

  <!-- Stage boxes -->
  <g>
    <rect x="40" y="105" width="190" height="120" rx="14" fill="#2a1a10" stroke="#ff7a3d" stroke-width="2"/>
    <text x="135" y="140" text-anchor="middle" fill="#ff9a66" font-size="13" font-weight="700" letter-spacing="1.5">1 · SIMULATE</text>
    <text x="135" y="168" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Lane + overhead</text>
    <text x="135" y="192" text-anchor="middle" fill="#c9d4e3" font-size="12.5">2 × 960×540 RGB views</text>
    <text x="135" y="210" text-anchor="middle" fill="#c9d4e3" font-size="12.5">shared frame ID · 8 Hz</text>
  </g>
  <g>
    <rect x="270" y="105" width="190" height="120" rx="14" fill="#10232b" stroke="#38d6bf" stroke-width="2"/>
    <text x="365" y="140" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1.5">2 · INGEST</text>
    <text x="365" y="168" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Group + queue</text>
    <text x="365" y="192" text-anchor="middle" fill="#c9d4e3" font-size="12.5">2-group bounded queue</text>
    <text x="365" y="210" text-anchor="middle" fill="#c9d4e3" font-size="12.5">camera / run / frame keys</text>
  </g>
  <g>
    <rect x="500" y="105" width="190" height="120" rx="14" fill="#141b33" stroke="#6aa8ff" stroke-width="2"/>
    <text x="595" y="140" text-anchor="middle" fill="#93c0ff" font-size="13" font-weight="700" letter-spacing="1.5">3 · SEE</text>
    <text x="595" y="168" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Detect + classify</text>
    <text x="595" y="192" text-anchor="middle" fill="#c9d4e3" font-size="12.5">YOLO + tracker per camera</text>
    <text x="595" y="210" text-anchor="middle" fill="#c9d4e3" font-size="12.5">shared EfficientNet-B0 SKU</text>
  </g>
  <g>
    <rect x="730" y="105" width="190" height="120" rx="14" fill="#1f1733" stroke="#bd9aff" stroke-width="2"/>
    <text x="825" y="140" text-anchor="middle" fill="#d2bcff" font-size="13" font-weight="700" letter-spacing="1.5">4 · FUSE</text>
    <text x="825" y="168" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Physical ledger</text>
    <text x="825" y="192" text-anchor="middle" fill="#c9d4e3" font-size="12.5">0.9 m carry-plane mapping</text>
    <text x="825" y="210" text-anchor="middle" fill="#c9d4e3" font-size="12.5">identity + zone events</text>
  </g>
  <g>
    <rect x="960" y="105" width="200" height="120" rx="14" fill="#2b1a10" stroke="#ffbb71" stroke-width="2"/>
    <text x="1060" y="140" text-anchor="middle" fill="#ffcf96" font-size="13" font-weight="700" letter-spacing="1.5">5 · CHECK OUT</text>
    <text x="1060" y="168" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Cart + dashboard</text>
    <text x="1060" y="192" text-anchor="middle" fill="#c9d4e3" font-size="12.5">versioned cart, receipts</text>
    <text x="1060" y="210" text-anchor="middle" fill="#c9d4e3" font-size="12.5">React via WebSocket</text>
  </g>

  <!-- Forward arrows -->
  <g stroke="#8fa3bf" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M232 165H266"/>
    <path d="M462 165H496"/>
    <path d="M692 165H726"/>
    <path d="M922 165H956"/>
  </g>

  <!-- Control loop back to Unity -->
  <path d="M1060 228V280H135V230" stroke="#ff7a3d" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/>
  <rect x="440" y="266" width="320" height="28" rx="14" fill="#0d1420"/>
  <text x="600" y="285" text-anchor="middle" fill="#ff9a66" font-size="13">scenario · run_id · pause   (Unity polls every 0.35 s)</text>

  <text x="40" y="322" fill="#8fa3bf" font-size="12">Offline only: product labels and masks. Fixed camera calibration supplies geometry; live product transforms never enter inference.</text>
</svg>
