services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: propass
      POSTGRES_PASSWORD: propass_local_demo
      POSTGRES_DB: propass
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - propass_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propass"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  propass_pg:
